
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub - Events</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8e8bc;
            margin: 0;
            padding: 25px;
            color: #2e4141;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1, h2 {
            text-align: center;
        }

        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            background: #2e4141;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #496565;
        }

        .event {
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .event button {
            width: 100px;
            margin-right: 8px;
        }

        #message {
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>🎓 Student Hub Portal</h1>
    <h2>Event Management</h2>

    <form id="eventForm">
        <input type="hidden" id="eventId">

        <label>Event Title</label>
        <input type="text" id="title" maxlength="100"
               placeholder="Enter event title" required>

        <label>Description</label>
        <textarea id="description"
                  placeholder="Enter description" required></textarea>

        <label>Event Date</label>
        <input type="date" id="eventDate" required>

        <button type="submit" id="saveButton">Add Event</button>
        <button type="button" id="cancelButton" hidden>
            Cancel Edit
        </button>
    </form>

    <p id="message" role="status"></p>

    <h2>All Events</h2>
    <div id="eventList">Loading events...</div>

</div>

<script>
const apiURL = "api_events.php";

const form = document.getElementById("eventForm");
const eventId = document.getElementById("eventId");
const title = document.getElementById("title");
const description = document.getElementById("description");
const eventDate = document.getElementById("eventDate");
const eventList = document.getElementById("eventList");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");
const cancelButton = document.getElementById("cancelButton");

function showMessage(text) {
    message.textContent = text;
}

async function apiRequest(method, data = null) {
    const options = { method };

    if (data !== null) {
        options.headers = {
            "Content-Type": "application/json"
        };
        options.body = JSON.stringify(data);
    }

    const response = await fetch(apiURL, options);
    const result = await response.json();

    if (!response.ok) {
        throw new Error(result.message || "Request failed");
    }

    return result;
}

// READ: Display events
async function loadEvents() {
    eventList.textContent = "Loading events...";

    try {
        const events = await apiRequest("GET");
        eventList.replaceChildren();

        if (events.length === 0) {
            eventList.textContent = "No events available.";
            return;
        }

        events.forEach(event => {
            const card = document.createElement("div");
            card.className = "event";

            const heading = document.createElement("h3");
            heading.textContent = event.title;

            const details = document.createElement("p");
            details.textContent = event.description;

            const date = document.createElement("p");
            date.textContent = "Date: " + event.event_date;

            const edit = document.createElement("button");
            edit.textContent = "Edit";
            edit.type = "button";
            edit.onclick = () => {
                eventId.value = event.id;
                title.value = event.title;
                description.value = event.description;
                eventDate.value = event.event_date;
                saveButton.textContent = "Update Event";
                cancelButton.hidden = false;
            };

            const del = document.createElement("button");
            del.textContent = "Delete";
            del.type = "button";
            del.onclick = () => deleteEvent(event.id);

            card.append(heading, details, date, edit, del);
            eventList.appendChild(card);
        });
    } catch (error) {
        eventList.textContent = "Could not load events.";
        showMessage(error.message);
    }
}

// CREATE and UPDATE
form.addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        title: title.value.trim(),
        description: description.value.trim(),
        event_date: eventDate.value
    };

    if (!data.title || !data.description || !data.event_date) {
        showMessage("Please fill all fields.");
        return;
    }

    const editing = eventId.value !== "";

    if (editing) {
        data.id = Number(eventId.value);
    }

    saveButton.disabled = true;

    try {
        const result = await apiRequest(
            editing ? "PUT" : "POST",
            data
        );

        showMessage(result.message);
        form.reset();
        eventId.value = "";
        saveButton.textContent = "Add Event";
        cancelButton.hidden = true;

        await loadEvents();
    } catch (error) {
        showMessage(error.message);
    } finally {
        saveButton.disabled = false;
    }
});

// DELETE
async function deleteEvent(id) {
    if (!confirm("Do you want to delete this event?")) {
        return;
    }

    try {
        const result = await apiRequest("DELETE", { id: Number(id) });
        showMessage(result.message);
        await loadEvents();
    } catch (error) {
        showMessage(error.message);
    }
}

// Cancel edit
cancelButton.addEventListener("click", function() {
    form.reset();
    eventId.value = "";
    saveButton.textContent = "Add Event";
    cancelButton.hidden = true;
    showMessage("");
});

loadEvents();
</script>

</body>
</html>
