<!DOCTYPE html>
<html>

<head>
    <title>Student Hub Portal - Login</title>
</head>

<body>

    <center>

        <h1>Student Hub Portal</h1>

        <hr>

        <br><br>

        <table border="1" cellpadding="40" width="450">

            <tr>
                <td align="center">

                    <h2>Log in to your account</h2>

                    <br><br>

                    <form action="dashboard.html">

                        <table>

                            <tr>
                                <td>Email:</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="email" size="30" required>
                                </td>
                            </tr>

                            <tr>
                                <td><br>Password:</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="password" size="30" required>
                                </td>
                            </tr>

                            <tr>
                                <td align="center">
                                    <br><br>

                                    <input type="submit" value="Login">

                                </td>
                            </tr>

                        </table>

                    </form>

                    <br><br>

                    <a href="forgotpassword.html">
                        Forgot Password?
                    </a>

                    <br><br>

                    Don't have an account?

                    <a href="signup.html">
                        <button>Sign Up</button>
                    </a>

                </td>
            </tr>

        </table>

    </center>

</body>

</html>
