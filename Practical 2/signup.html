<!DOCTYPE html>
<html>

<head>
    <title>Student Hub Portal - Sign Up</title>
</head>

<body>

    <center>

        <h1>Student Hub Portal</h1>

        <hr>

        <br><br>

        <table border="1" cellpadding="35" width="500">

            <tr>

                <td align="center">

                    <h2>Create New Account</h2>

                    <br><br>

                    <form action="login.html">

                        <table>

                            <tr>
                                <td>Full Name:</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="text" size="35" required>
                                </td>
                            </tr>

                            <tr>
                                <td><br>Email:</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="email" size="35" required>
                                </td>
                            </tr>

                            <tr>
                                <td><br>Mobile Number:</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="tel" size="35" required>
                                </td>
                            </tr>

                            <tr>
                                <td><br>Password:</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="password" size="35" required>
                                </td>
                            </tr>

                            <tr>
                                <td><br>Confirm Password:</td>
                            </tr>

                            <tr>
                                <td>
                                    <input type="password" size="35" required>
                                </td>
                            </tr>

                            <tr>

                                <td align="center">

                                    <br><br>

                                    <input type="submit" value="Sign Up">

                                </td>

                            </tr>

                        </table>

                    </form>

                    <br><br>

                    Already have an account?

                    <a href="login.html">
                        <button>Login</button>
                    </a>

                </td>

            </tr>

        </table>

    </center>

</body>

</html>
